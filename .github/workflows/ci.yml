name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Fast unit/integration tests (no database required)
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: |
        cd server
        bun install
    
    - name: Run unit/integration tests
      run: |
        cd server
        bun test tests/integration/
    
    - name: Test summary
      run: echo "✅ Unit and integration tests passed"

  # E2E tests with Docker (slower but comprehensive)
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: |
        cd server
        bun install
    
    - name: Start Docker services
      run: |
        docker compose -f docker-compose.test.yml up -d
        sleep 10
    
    - name: Check service health
      run: |
        curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8001/health
    
    - name: Run E2E tests
      run: |
        cd server
        bun test tests/e2e/real-integration.test.js
    
    - name: Show logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.test.yml logs
    
    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v

  # Linting and code quality
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: |
        cd server
        bun install
    
    - name: Check for syntax errors
      run: |
        cd server
        # Check all JS files compile
        bun build index.js --target=bun --outfile=/tmp/index.check.js
        echo "✅ No syntax errors found"
